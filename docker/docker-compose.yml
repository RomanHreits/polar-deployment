services:

  catalog-service:
    depends_on:
      - polar-postgres
      - fluent-bit
      - prometheus
    image: catalog-service:latest
    container_name: catalog-service
    ports:
      - "9001:9001"
      - "8001:8001" # remote debugging port
    environment:
      - BPL_JVM_THREAD_COUNT=50 # buildpack var to configure the number of threads in the JVM
      - BPL_DEBUG_PORT=8001 # buildpack var to enable remote debugging on port 8001
      - BPL_DEBUG_ENABLED=true # buildpack var to enable remote debugging
      - SPRING_DATASOURCE_URL=jdbc:postgresql://polar-postgres:5432/polardb_catalog
      - SPRING_PROFILES_ACTIVE=testdata
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888 # URL of the config server with DNS name as the service name
    logging:
      driver: fluentd
      options:
        fluentd-address: 172.20.10.13:24224 # address of the Fluent Bit container with DNS name as the service name

  config-service:
    image: config-service:latest
    container_name: config-service
    ports:
      - "8888:8888"
      - "9888:9888" # remote debugging port
    environment:
      - BPL_JVM_THREAD_COUNT=50 # buildpack var to configure the number of threads in the JVM
      - BPL_DEBUG_PORT=9888 # buildpack var to enable remote debugging on port 9888
      - BPL_DEBUG_ENABLED=true # buildpack var to enable remote debugging
        
  order-service:      
    depends_on:
      - polar-postgres
      - catalog-service
      - polar-rabbitmq
    image: order-service:latest
    container_name: order-service
    ports:
      - "9002:9002"
      - "8002:8002" # remote debugging port
    environment:
      - BPL_JVM_THREAD_COUNT=50 # buildpack var to configure the number of threads in the JVM
      - BPL_DEBUG_PORT=8002 # buildpack var to enable remote debugging on port 8002
      - BPL_DEBUG_ENABLED=true # buildpack var to enable remote debugging
      - SPRING_FLYWAY_URL=jdbc:postgresql://polar-postgres:5432/polardb_order
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888 # URL of the config server with DNS name as the service name
      - SPRING_R2DBC_URL=r2dbc:postgresql://polar-postgres:5432/polardb_order
      - POLAR_CATALOG_SERVICE_URI=http://catalog-service:8082 # URL of the catalog service with DNS name as the service name
      - SPRING_RABBITMQ_HOST=polar-rabbitmq # DNS name of the RabbitMQ service
      
  dispatcher-service:    
    depends_on:
      - polar-rabbitmq
    image: dispatcher-service:latest
    container_name: dispatcher-service
    ports:
      - "9003:9003"
      - "8003:8003" # remote debugging port
    environment:
      - BPL_JVM_THREAD_COUNT=50 # buildpack var to configure the number of threads in the JVM
      - BPL_DEBUG_PORT=8003 # buildpack var to enable remote debugging on port 8003
      - BPL_DEBUG_ENABLED=true # buildpack var to enable remote debugging
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888 # URL of the config server with DNS name as the service name
      - SPRING_RABBITMQ_HOST=polar-rabbitmq # DNS name of the RabbitMQ service

  edge-service:
    depends_on:
      - fluent-bit
      - polar-keycloak
      - polar-redis
      - polar-ui
    image: "edge-service"
    container_name: "edge-service"
    ports:
      - "9000:9000"
      - "8000:8000"
    environment:
      # Buildpacks environment variable to enable debug through a socket on port 8000
      - BPL_DEBUG_ENABLED=true
      - BPL_DEBUG_PORT=8000
      - JAVA_TOOL_OPTIONS=-javaagent:/workspace/BOOT-INF/lib/opentelemetry-javaagent-1.33.3.jar
      - OTEL_SERVICE_NAME=edge-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_METRICS_EXPORTER=none
      - CATALOG_SERVICE_URL=http://catalog-service:9001
      - ORDER_SERVICE_URL=http://order-service:9002
      - SPA_URL=http://polar-ui:9004
      - SPRING_CLOUD_CONFIG_URI=http://config-service:8888
      - SPRING_REDIS_HOST=polar-redis
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=http://host.docker.internal:8080/realms/PolarBookshop
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224

  polar-postgres:
    image: postgres:14.4
    container_name: polar-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql # initialize with a loading of init.sql script
        
  polar-redis:
    image: redis:7.0.5
    container_name: polar-redis
    ports:
      - "6379:6379"

  # docker exec polar-rabbitmq rabbitmq-plugins enable rabbitmq_stream
  polar-rabbitmq:      
    image: rabbitmq:3.9.13-management
    container_name: polar-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # management UI port
      - "5552:5552" # stream port
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf   
        
  polar-keycloak:
    image: quay.io/keycloak/keycloak:21.0.1
    container_name: polar-keycloak
    command: start-dev --import-realm # import the realm configuration from the JSON file in the mounted volume when the container starts
    volumes:
      - ./keycloak:/opt/keycloak/data/import # mount the local keycloak directory to the Keycloak container to import the realm configuration from the JSON file
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=user
      - KEYCLOAK_ADMIN_PASSWORD=password

  polar-ui:
    image: "ghcr.io/polarbookshop/polar-ui:v1"
    container_name: polar-ui
    ports:
      - "9004:9004" # nginx will serve the SPA on port 9004
    environment:
      - PORT=9004  # configure the port for the nginx server to serve the SPA

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    depends_on:
      - loki
      - prometheus
    ports:
      - "3000:3000" # Grafana UI port
    environment:
        - GF_SECURITY_ADMIN_USER=user
        - GF_SECURITY_ADMIN_PASSWORD=password
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      #- ./observability/grafana/dashboards:/var/lib/grafana/provisioning/dashboards # mount the dashboards directory to the Grafana container to load the dashboard JSON files into Grafana
      #- ./observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml # mount the datasource.yaml file to the Grafana container to provision the Prometheus data source configuration
      #- ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini # mount the grafana.ini file to the Grafana container to configure Grafana settings such as enabling anonymous access

  loki:
    image: grafana/loki:main-2e3da9a
    container_name: loki
    depends_on:
      - fluent-bit
    ports:
      - "3100:3100" # Loki API port

  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:3.7
    container_name: fluent-bit
    ports:
      - "24224:24224" # Fluent Bit forward input plugin port for receiving logs from the Fluent Bit forward output plugin
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push # URL of the Loki API for the Fluent Bit Loki output plugin to send logs to Loki with DNS name as the service name
    volumes:
      - ./observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf # mount the Fluent Bit configuration file to the Fluent Bit container to configure Fluent Bit settings such as the input and output plugins and their configurations

  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: prometheus
    ports:
      - "9090:9090" # Prometheus UI and API port
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml # mount the Prometheus configuration file to the Prometheus container to configure Prometheus settings such as the scrape configs for scraping metrics from the application services and the Loki data source for scraping logs from Loki
